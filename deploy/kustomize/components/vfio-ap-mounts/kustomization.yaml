apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# VM-path host mounts. Adds the writable /sys/devices/vfio_ap subtree the driver
# needs to manage vfio-ap mediated devices (mdev create / assign / remove via the
# matrix interface, internal/mdev/mdev.go). Under the hardened base the
# container's own /sys is read-only, so the vfio_ap bind mount is the only
# writable view of the matrix interface.
#
# The host CDI spool (/var/run/cdi) lives in the base DaemonSet: both the VM
# and container prepare paths write CDI specs there, and DirectoryOrCreate does
# not gate pod start. This component therefore only carries the vfio_ap mount.
#
# Scoped to a component, NOT folded into deviceclass-vm, on purpose: a hostPath
# with `type: Directory` is a kubelet pre-start gate that `privileged` does not
# bypass, and /sys/devices/vfio_ap exists only when the vfio_ap module is loaded
# (a VM-path-only prerequisite). The dev overlay also pulls deviceclass-vm for
# the mock DeviceClass on bare nodes. Gating its pod start there would break it.
# Include this component only on VM-capable nodes that have vfio_ap loaded (the
# example overlay). Container-only and bare-node deployments omit it.
patches:
  - target:
      kind: DaemonSet
      name: cex-dra-driver
    patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: cex-dra-driver
      spec:
        template:
          spec:
            containers:
              - name: plugin
                volumeMounts:
                  - name: sys-devices-vfio-ap
                    mountPath: /sys/devices/vfio_ap
            volumes:
              - name: sys-devices-vfio-ap
                hostPath:
                  path: /sys/devices/vfio_ap
                  type: Directory
