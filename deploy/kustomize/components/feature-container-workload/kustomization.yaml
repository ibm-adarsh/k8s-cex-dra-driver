apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Opt-in: enables the container workload path, which is alpha and off by
# default. Ships the halves of the feature as one unit so they cannot drift
# apart: the container DeviceClass, the ContainerWorkload feature gate the
# driver requires before it prepares a claim against that class, and the
# /sys/class/zcrypt host mount used to create filtered zcrypt device nodes.
#
# The CDI spool mount lives in the base DaemonSet (shared with the VM path).
# Shadow AP sysfs trees are written under the already-mounted kubelet plugin
# data directory, so no extra volume is required for them.
resources:
  - deviceclass-container.yaml

patches:
  - target:
      kind: DaemonSet
      name: cex-dra-driver
    patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: cex-dra-driver
      spec:
        template:
          spec:
            containers:
              - name: plugin
                env:
                  - name: FEATURE_GATES
                    value: ContainerWorkload=true
                volumeMounts:
                  - name: sys-class-zcrypt
                    mountPath: /sys/class/zcrypt
            volumes:
              - name: sys-class-zcrypt
                hostPath:
                  path: /sys/class/zcrypt
                  type: Directory
